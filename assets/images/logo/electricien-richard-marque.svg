<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 108" width="132" height="108" role="img" aria-label="Electricien Richard">
  <!-- Anneau jaune ouvert : de 1h, vers la gauche, jusqu'a 6h -->
  <path d="M85 20 A44 44 0 1 0 44 96.5" fill="none" stroke="#FACC15" stroke-width="9" stroke-linecap="round"/>
  <!-- Cable sombre : passe sous la lettre puis remonte vers la prise -->
  <path d="M44 96.5 A44 44 0 0 0 92 79 C97 74 100 69 105 64" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="round"/>
  <!-- Prise male -->
  <g fill="#111827" transform="rotate(-42 110 58)">
    <rect x="103" y="50" width="17" height="15"/>
    <rect x="120" y="52" width="8" height="4"/>
    <rect x="120" y="59" width="8" height="4"/>
  </g>
  <!-- Lettre R -->
  <path fill="#111827" fill-rule="evenodd"
        d="M36 24 L50 24 L50 78 L36 78 Z
           M50 24 L64 24 C73.5 24 80 30.8 80 39.5 C80 48.2 73.5 55 64 55 L50 55 Z
           M57 55 L83 78 L64 78 L50 61 L50 55 Z
           M50 34 L50 45 L63 45 C66.8 45 69 42.7 69 39.5 C69 36.3 66.8 34 63 34 Z"/>
  <!-- Eclair : etroit, il croise le montant gauche du R -->
  <path fill="#FACC15" d="M56 13 L30 51 L45 51 L38 94 L64 48 L50 48 Z"/>
</svg>
